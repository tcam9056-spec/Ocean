kind = "web"
previewPath = "/"
title = "Sóng nước của Đại Dương"
version = "1.0.0"
id = "artifacts/song-nuoc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24678

[services.development]
run = "pnpm --filter @workspace/song-nuoc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/song-nuoc", "run", "build" ]
publicDir = "artifacts/song-nuoc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24678"
BASE_PATH = "/"
