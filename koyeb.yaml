name: song-nuoc
services:
  - name: web
    type: web
    git:
      branch: main
    build:
      buildpack:
        build-command: "pnpm install --frozen-lockfile && pnpm run build"
        run-command: "pnpm run start"
    env:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        secret: DATABASE_URL
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    instance_type: nano
    regions:
      - fra
    scaling:
      min: 0
      max: 1
